<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Sign Up / Log In</title>
</head>
<body>
    <div id="login-page">
        <h1>Log In</h1>
        <label>Email:<br><input type="email" id="login-email"></label><br><br>
        <label>Password:<br><input type="password" id="login-password"></label><br><br>
        <button id="login-btn">Log In</button>
        <p id="login-error"></p>
        <p>Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
    </div>

    <div id="signup-page" style="display:none;">
        <h1>Sign Up</h1>
        <label>Name:<br><input type="text" id="signup-name"></label><br><br>
        <label>Email:<br><input type="email" id="signup-email"></label><br><br>
        <label>Password:<br><input type="password" id="signup-password"></label><br><br>
        <button id="signup-btn">Sign Up</button>
        <p id="signup-error"></p>
        <p>Already have an account? <a href="#" id="show-login">Log in</a></p>
    </div>

    <div id="dashboard-page" style="display:none;">
        <h1>Dashboard</h1>
        <p>Welcome, <strong id="dash-name"></strong></p>
        <p>Email: <span id="dash-email"></span></p>
        <button type="button" onClick="window.location.href='index.html'"> Back to Game </button>
        <button id="logout-btn">Log Out</button>
    </div>

    <script src="login.js"></script>
    </body>
</html>
