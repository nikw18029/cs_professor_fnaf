<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    .auth-form { display: flex; flex-direction: column; gap: 0.75rem; width: min(20rem, 100%); align-items: stretch; }
    .auth-form input {
      font-family: 'VT323', monospace; font-size: 1.25rem;
      background: var(--btn); color: var(--ink);
      border: 1px solid var(--panel-edge); border-radius: 2px;
      padding: 0.6rem 0.8rem;
    }
    .auth-form input:focus { outline: none; border-color: var(--accent); }
    #error-msg { color: var(--accent); min-height: 1.2em; text-align: center; }
  </style>
</head>
<body>
  <main class="prompt">
    <h1>Helpdesk Shift at Blackington</h1>
    <p class="subtitle">Sign in to continue</p>
    <div class="auth-form">
      <input id="username" type="text" placeholder="Username" autocomplete="username" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="prompt-buttons">
        <button type="button" class="start-btn" id="login">Log in</button>
        <button type="button" class="start-btn" id="signup">Sign up</button>
        <button type="button" class="start-btn" id="guest">Play as guest</button>
      </div>
      <p id="error-msg"></p>
    </div>
  </main>
  <script type="module" defer src="login.js"></script>
</body>
</html>
