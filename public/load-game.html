<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Load Game</title>
  <link rel="stylesheet" href="ui.css">
</head>

<body>
  <main class="prompt">
    <h1>Save Detected</h1>
    <p class="prompt-text">You have an existing game save. Would you like to load?</p>
    <div class="prompt-buttons">
      <button class="start-btn" id="yes">Yes!</button>
      <button class="start-btn secondary" id="no">No (start new game)</button>
    </div>
  </main>
  <script type="module" defer src="load-game.js"></script>
</body>

</html>
