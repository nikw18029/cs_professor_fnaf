<!doctype html>
<html>

<head>
	<title>CS Professors FNAF</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="map.css" />
	<link rel="stylesheet" href="game.css" />
	<script type="module" defer src="simulation.js"></script>
</head>

<body>
	<!-- button to move to log in page -->
	<button type="button" onclick="window.location.href='login.html'"> Log in </button>

	<!-- showing what user is currently logged in on the game page
	<p>Logged in as: <span id="current-user">Not logged in</span></p>
	does not currently work because we need some server storage
 	-->


	<div id="game-container">
		<div id="game-screen">
			<img class="room-img" />
		</div>

		<div id="map-screen">
			<div id="status-bar">Time: <span id="timer">12:00</span></div>
		
			<div id="map-grid">
				<div id="start" class="room-box full-width">Start</div>
		
				<div id="a1" class="room-box">A1</div>
				<div id="b1" class="room-box">B1</div>
				<div id="a2" class="room-box">A2</div>
				<div id="b2" class="room-box">B2</div>
		
				<div id="end" class="room-box full-width player-room">Office</div>
				
				<div id="controls">
					<button id="hide-btn">HIDE UNDER DESK</button>
				</div>
			</div>
		</div>
	</div>
</body>

</html>
