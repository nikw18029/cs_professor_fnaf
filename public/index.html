<!doctype html>
<html>

<head>
	<title>CS Professors FNAF</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" href="map.css" />
	<link rel="stylesheet" href="game.css" />
	<script type="module" defer src="simulation.js"></script>
</head>

<body>
	<div id="interface-elements">
		<div id="status-bar">Time: <span id="timer">12:00</span></div>
		<div id="controls">
			<span class="control">1 - First Floor</span>
			<span class="control">2 - Second Floor</span>
			<span class="control">H - Hide</span>
			<button id="logout-btn">Logout</button>
		</div>
	</div>


	<div id="game-container">
		<div id="game-screen">
			<div id="img-screen">
				<img src="img/static.png" id="room-static" class="room-img" style="display: none;" />
			</div>

			<div id="hide-bar">
				<div id="hide-bar-fill">
				</div>
				<span id="hide-text">READY</span>
			</div>
		</div>

		<div id="map-screen">
			<div class="map-layer" id="map-layer-1"></div>
			<div class="map-layer" id="map-layer-2"></div>
		</div>
	</div>

	<div id="audio-clips">
		<audio src="audio/6 AM.mp3" id="win-audio"></audio>
		<audio src="audio/game over sandro.mp3" id="game-over-sandro-audio"></audio>
		<audio src="audio/game over bilitski.mp3" id="game-over-bilitski-audio"></audio>
		<audio src="audio/game over ohl.mp3" id="game-over-ohl-audio"></audio>
		<audio src="audio/game over deepak.mp3" id="game-over-deepak-audio"></audio>
	</div>
</body>

</html>
